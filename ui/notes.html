<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学屿 · 笔记</title>
<link rel="stylesheet" href="/mac.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<style>
  .note-list{width:240px;flex-shrink:0;border-right:2px solid var(--ink);display:flex;flex-direction:column;background:rgba(255,253,246,.6);min-height:0}
  .nl-head{padding:12px 14px;border-bottom:2px dashed #e0d6bd;display:flex;align-items:center;gap:8px}
  .nl-head b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nl-head .cnt{font-size:11px;color:var(--dim);font-weight:800;flex-shrink:0}
  .nl-head button{margin-left:auto}
  .nl-items{flex:1;overflow-y:auto;padding:8px}
  .nl-it{padding:10px 12px;border-radius:10px 4px 11px 5px;border:2px solid transparent;cursor:pointer;margin-bottom:4px}
  .nl-it:hover{border-color:var(--ink)}
  .nl-it.on{background:#fff;border:2px solid var(--ink);box-shadow:2px 2px 0 rgba(61,55,44,.25)}
  .nl-it b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nl-it p{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .nl-it .m{display:flex;gap:6px;margin-top:5px;align-items:center}
  .nl-it .m span{font-size:10px;color:var(--dim);font-weight:700}

  .editor{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .ed-title{padding:16px 24px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ed-title input{flex:1;min-width:140px;border:none;outline:none;background:transparent;font-size:20px;font-weight:850;color:var(--ink)}
  .ed-meta{padding:6px 24px 10px;font-size:11.5px;color:var(--dim);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ed-meta .save{margin-left:auto;color:var(--grn);font-weight:800}
  .ed-toolbar{display:flex;gap:4px;align-items:center;padding:8px 16px;border-top:2px dashed #e0d6bd;border-bottom:2px dashed #e0d6bd;background:rgba(255,253,246,.7);flex-wrap:wrap}
  .tb{width:28px;height:28px;border:1.5px solid transparent;border-radius:7px;background:transparent;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .tb:hover{border-color:var(--ink);background:#fff}
  .tb:active{background:var(--ylw)}
  .tb-sep{width:1px;height:16px;background:#ddd2b8;margin:0 4px}

  /* 编辑区：源码 / 分屏 / 预览 三态，默认分屏（边写边渲染） */
  .ed-body{flex:1;display:flex;min-height:0}
  #editor-area{flex:1;border:none;outline:none;resize:none;padding:18px 22px;font-size:13.5px;line-height:1.9;background:transparent;font-family:ui-monospace,Menlo,monospace;color:var(--ink)}
  #preview-area{flex:1;overflow-y:auto;padding:18px 22px;display:none;border-left:2px dashed #e0d6bd}
  body.split #preview-area{display:block}
  body.preview #editor-area{display:none}
  body.preview #preview-area{display:block;border-left:none}
  body.edit #preview-area{display:none}

  .ai-side{width:300px;flex-shrink:0;border-left:2px solid var(--ink);background:rgba(255,253,246,.85);display:flex;flex-direction:column;min-height:0;position:relative}
  .ai-resize{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5}
  .ai-resize:hover{background:rgba(240,180,41,.25)}
  .ai-head{padding:10px 14px;border-bottom:2px dashed #e0d6bd;display:flex;align-items:center;gap:6px}
  .ai-head b{font-size:13.5px}
  .ai-head button{margin-left:auto}
  .ai-status{font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:8px;background:#eef3fb;border:1.5px solid var(--ink)}
  .ai-status.busy{background:var(--ylw);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .ai-sessions{padding:8px 10px;border-bottom:2px dashed #e0d6bd;display:flex;gap:6px;align-items:center;background:#fffdf6}
  .ai-sessions select{flex:1;border:2px solid var(--ink);border-radius:9px 4px 10px 5px;padding:4px 8px;font-size:12px;background:#fff;outline:none}
  .ai-sessions .tb-btn{width:26px;height:26px;min-width:26px}
  .ai-chat{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:94%;padding:9px 12px;font-size:12px;border:2px solid var(--ink);line-height:1.65}
  .msg.user{align-self:flex-end;background:#e3edfd;border-radius:13px 4px 13px 4px}
  .msg.bot{align-self:flex-start;background:#fff;border-radius:4px 13px 4px 13px}
  .msg.bot .who{font-size:10px;font-weight:800;color:var(--pnk);margin-bottom:3px;display:flex;gap:6px;align-items:center}
  .msg .ins{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:800;color:var(--pnk);border-bottom:1.5px solid var(--pnk);cursor:pointer;margin-right:10px}
  .msg .src{margin-top:6px;font-size:10px;color:var(--dim)}
  .msg .src a{color:var(--blu)}
  .msg .cursor{display:inline-block;width:7px;height:13px;background:var(--pnk);vertical-align:-2px;animation:pulse .8s infinite}
  .ai-dock{border-top:2px solid var(--ink);background:#fffdf6}
  .ai-quick{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 6px}
  .ai-quick .chip{font-size:11px;padding:3px 9px;transition:transform .1s,opacity .2s}
  .ai-quick .chip.sel{background:var(--pnk);color:#fff}
  .ai-quick .chip.busy{opacity:.55;pointer-events:none;border-style:dashed}
  .ai-quick .chip.active{background:var(--blu);color:#fff}
  .ai-modes{display:flex;gap:6px;align-items:center;padding:2px 12px 8px}
  .ai-modes .lab{font-size:10.5px;font-weight:800;color:var(--dim)}
  .ai-modes .seg button{padding:3px 10px;font-size:11px}
  .ai-modes .chip{font-size:11px;padding:3px 9px}
  .ai-modes .spacer{flex:1}
  .ai-input{padding:0 12px 12px;display:flex;gap:8px}
  .ai-input input{flex:1;border:2px solid var(--ink);border-radius:11px 5px 12px 6px;padding:8px 12px;font-size:12.5px;outline:none;background:#fff}
  .ai-input button{border:2px solid var(--ink);background:var(--pnk);color:#fff;border-radius:11px 5px 12px 6px;width:38px;font-size:15px;font-weight:800}
  .ai-input button:hover{filter:brightness(1.08)}
  .ai-input button:disabled{opacity:.5}
  .nl-folders{padding:8px;border-bottom:2px dashed #e0d6bd;display:flex;flex-wrap:wrap;gap:4px}
  .folder-chip{font-size:10.5px;font-weight:800;border:1.5px solid var(--ink);border-radius:8px 3px 9px 4px;padding:1px 8px;background:#fff;cursor:pointer}
  .folder-chip.on{background:var(--ylw)}
  /* 润色方案弹窗 */
  .variant{border:2px solid var(--ink);border-radius:12px 5px 13px 6px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .variant h4{font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .variant .vbody{max-height:180px;overflow-y:auto;font-size:12px;border-top:2px dashed #e0d6bd;padding-top:8px}
</style>
</head>

  <header class="app-header" id="app-header" data-title="📝 笔记">
      <span class="app-title"><span class="ico">🏝️</span> 学屿</span>
      <span class="sep-v"></span>
      <span class="page-title">📝 笔记</span>

        <button class="tb-btn" id="global-search" title="全局搜索 ⌘K">🔍</button>

      </div>

  <div class="app">

<script src="/vendor/purify.min.js"></script>
<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/katex/auto-render.min.js"></script>
<script src="/app.js"></script>
<script>
// 标识符（$ / api / toast / esc / md 等）由 app.js 全局提供
let notes = [], folders = [], curId = null, curNote = null, dirty = false;
let curFolder = null, filter = '';
let pendingContinue = false, webOn = false, thinking = 'standard';
/* AI 会话与互斥状态 */
let aiBusy = null;            // null | {label, chip, abort}
let aiChatId = null;          // 当前会话 id
let aiMessages = [];          // [{role, content, sources?}]

/* ---------- 编辑器：源码 / 分屏 / 预览（默认分屏，实时渲染） ---------- */
const MODE_KEY = 'xueyu-note-mode';
function setMode(mode) {
  document.body.classList.remove('edit', 'split', 'preview');
  if (mode !== 'edit') document.body.classList.add(mode);
  localStorage.setItem(MODE_KEY, mode);
  $$('#mode-seg button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  const pv = $('#preview-area');
  if (pv) pv.dataset.src = '';   // 强制下次全量渲染，避免残留旧内容
  renderLive();
}
$$('#mode-seg button').forEach(b => b.onclick = () => setMode(b.dataset.m));
const renderLive = debounce(() => {
  const ta = $('#editor-area'), pv = $('#preview-area');
  if (!document.body.classList.contains('split') && !document.body.classList.contains('preview')) return;
  if (ta.value === pv.dataset.src) return;
  pv.dataset.src = ta.value;
  mdRender(pv, ta.value);
}, 140);
$('#editor-area').addEventListener('scroll', () => {
  if (!document.body.classList.contains('split')) return;
  const ta = $('#editor-area'), pv = $('#preview-area');
  const ratio = ta.scrollTop / Math.max(1, ta.scrollHeight - ta.clientHeight);
  pv.scrollTop = ratio * (pv.scrollHeight - pv.clientHeight);
});
function toggleMode() {
  const b = document.body;
  setMode(b.classList.contains('split') ? 'preview' : b.classList.contains('preview') ? 'edit' : 'split');
}

$('#editor-area').addEventListener('input', () => { dirty = true; renderLive(); saveNote(); });

/* 工具栏：源码光标处插 Markdown */
$$('.ed-toolbar .tb').forEach(btn => btn.addEventListener('click', () => {
  const ta = $('#editor-area');
  ta.focus();
  const s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e);
  const kind = btn.dataset.md;
  const wrap = (b, a, ph) => { ta.setRangeText(b + (sel || ph) + a, s, e, 'end'); };
  const line = pfx => {
    const ls = ta.value.lastIndexOf('\n', s - 1) + 1;
    ta.setRangeText(pfx, ls, ls, 'end');
  };
  const acts = {
    bold: () => wrap('**', '**', '加粗文字'), italic: () => wrap('*', '*', '斜体'),
    strike: () => wrap('~~', '~~', '删除线'), mark: () => wrap('==', '==', '高亮'),
    underline: () => wrap('<u>', '</u>', '下划线'),
    h1: () => line('# '), h2: () => line('## '), h3: () => line('### '),
    ul: () => line('- '), ol: () => line('1. '), task: () => line('- [ ] '), quote: () => line('> '),
    code: () => wrap('`', '`', 'code'),
    formula: () => wrap('$', '$', 'E=mc^2'),
    blockformula: () => wrap('\n$$\n', '\n$$\n', 'E=mc^2'),
    codeblock: () => wrap('\n```\n', '\n```\n', 'code'),
    table: () => wrap('', '', '| 列1 | 列2 | 列3 |\n| --- | --- | --- |\n| 内容 | 内容 | 内容 |\n'),
    link: () => wrap('[', '](https://)', '链接文字'),
    image: () => wrap('![', '](https://)', '图片'),
    hr: () => wrap('\n---\n', '', ''),
  };
  acts[kind] && acts[kind]();
  dirty = true; renderLive(); saveNote();
}));
document.addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey)) return;
  const k = e.key.toLowerCase();
  if (k === 'b') { e.preventDefault(); $('[data-md="bold"]').click(); }
  if (k === 'i') { e.preventDefault(); $('[data-md="italic"]').click(); }
});

/* ---------- 列表 ---------- */
async function loadFolders() {
  folders = await api('/notes/folders');
  const params = new URLSearchParams(location.search);
  if (params.get('folder')) curFolder = params.get('folder');
  $('#nl-folders').innerHTML = `<span class="folder-chip ${curFolder == null ? 'on' : ''}" data-f="">全部</span>` +
    folders.map(f => `<span class="folder-chip ${curFolder === f.folder ? 'on' : ''}" data-f="${esc(f.folder)}">${esc(f.folder)} ${f.count}</span>`).join('') +
    `<span class="folder-chip" data-f="+">＋</span>`;
  $$('#nl-folders .folder-chip').forEach(ch => ch.onclick = async () => {
    if (ch.dataset.f === '+') {
      const name = await XueYu.promptDialog('新建笔记本', {label: '名称'}); if (!name) return;
      const n = await api('/notes', {method: 'POST', body: {title: '未命名笔记', folder: name, content: ''}});
      curFolder = name; await loadFolders(); openNote(n.id); return;
    }
    curFolder = ch.dataset.f || null; loadFolders(); loadList();
  });
}

async function loadList() {
  notes = await api('/notes' + (curFolder ? '?folder=' + encodeURIComponent(curFolder) : ''));
  $('#nl-title').textContent = curFolder || '全部笔记';
  $('#nl-count').textContent = notes.length + ' 篇';
  const list = filter ? notes.filter(n => (n.title + n.excerpt).toLowerCase().includes(filter)) : notes;
  $('#nl-items').innerHTML = list.length ? list.map(n => `
    <div class="nl-it ${n.id === curId ? 'on' : ''}" data-id="${n.id}">
      <b>${esc(n.title)}</b><p>${esc(n.excerpt || '…')}</p>
      <div class="m"><span>${ago(n.updated)}</span>${n.ai_assisted ? '<span class="ai-mini" style="background:var(--ink);color:#fff;font-size:9.5px;font-weight:800;border-radius:6px;padding:1px 6px">✨ AI</span>' : ''}
        ${(n.tags || []).slice(0, 2).map(t => `<span>#${esc(t)}</span>`).join('')}</div>
    </div>`).join('') : `<div class="empty"><span class="big">🍃</span>${filter ? '没有匹配的笔记' : '还没有笔记'}</div>`;
  $$('#nl-items .nl-it').forEach(el => el.onclick = () => openNote(el.dataset.id));
}

/* ---------- 打开 / 保存 ---------- */
async function openNote(id) {
  if (!id) return;
  if (dirty && curId) {
    if (!(await XueYu.confirmDialog('未保存', '有未保存的修改，仍要切换吗？'))) return;
  }
  try { curNote = await api('/notes/' + id); } catch (e) { showError(e); return; }
  curId = id; dirty = false;
  aiChatId = null; aiMessages = [];
  $('#note-title').value = curNote.title;
  $('#editor-area').value = curNote.content;
  $('#preview-area').dataset.src = '';

/* 互斥状态管理 */
function setBusy(label, chipEl) {
  aiBusy = {label, chip: chipEl || null, abort: new AbortController()};
  if (chipEl) { chipEl.classList.add('busy', 'active'); }
  const st = $('#ai-status');
  st.textContent = label + '…'; st.classList.add('busy');
}
function clearBusy() {
  if (aiBusy?.chip) aiBusy.chip.classList.remove('busy', 'active');
  aiBusy = null;
  const st = $('#ai-status');
  st.textContent = '就绪'; st.classList.remove('busy');
}
/* 正在忙时点其他功能 → 询问是否取消当前 */
async function guardBusy(nextLabel) {
  if (!aiBusy) return true;
  const goOn = await XueYu.confirmDialog('任务进行中', `「${aiBusy.label}」正在进行中，确定取消它并开始「${nextLabel}」吗？`);
  if (goOn) {
    aiBusy.abort.abort();
    clearBusy();
    return true;
  }
  return false;
}

/* 流式执行 */
async function runStreaming(action, userLabel, message, {chip = null, silentUser = false} = {}) {
  if (!curId) { toast('先选中一篇笔记', '', 'err'); return null; }
  if (!(await guardBusy(userLabel))) return null;
  setBusy(userLabel, chip);
  if (!silentUser) aiMsg('user', esc(message || userLabel));
  const div = aiMsg('bot', '');
  div.querySelector('.who').insertAdjacentHTML('beforeend', `<span class="ai-status busy">${userLabel}</span>`);
  const bodyDiv = document.createElement('div');
  div.appendChild(bodyDiv);
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  div.appendChild(cursor);
  let full = '', sources = null, failed = null;
  try {
    const res = await fetch(`/api/notes/${curId}/ai/stream`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action, message, history: aiMessages.slice(-8), thinking, web: webOn}),
      signal: aiBusy.abort.signal,
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 2);
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'delta') { full += ev.text; bodyDiv.innerHTML = md(full); $('#ai-chat').scrollTop = 1e6; }
        else if (ev.type === 'sources') { sources = ev.sources; }
        else if (ev.type === 'status') { div.querySelector('.who .ai-status').textContent = ev.text; }
        else if (ev.type === 'error') { failed = ev.message; }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') { /* 用户取消 */ }
    else failed = e.message;
  }
  cursor.remove();
  div.querySelector('.who .ai-status')?.remove();
  clearBusy();
  if (failed) { bodyDiv.insertAdjacentHTML('beforeend', `<div style="color:var(--org)">⚠️ ${esc(failed)}</div>`); return null; }
  bodyDiv.innerHTML = md(full);
  if (window.renderMathInElement) {
    try { renderMathInElement(bodyDiv, {delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]}); } catch {}
  }
  if (sources) appendSources(div, sources);
  // 记录进当前会话
  aiMessages.push({role: 'user', content: message || userLabel});
  aiMessages.push({role: 'assistant', content: full, sources});
  saveChatSession();
  return {text: full, div};
}

function saveChatSession() {
  if (!aiChatId || !curId) return;
  const title = (aiMessages.find(m => m.role === 'user')?.content || '新对话').slice(0, 18);
  api(`/notes/${curId}/chats/${aiChatId}`, {method: 'PUT', body: {title, messages: aiMessages}})

}

/* AI 面板宽度拖拽（240–520px） */
(() => {
  const handle = $('#ai-resize'), side = $('#ai-side');
  let startX = 0, startW = 0, dragging = false;
  handle.addEventListener('mousedown', e => {
    dragging = true; startX = e.clientX; startW = side.offsetWidth;
    e.preventDefault();
    const move = ev => {
      if (!dragging) return;
      const w = Math.min(520, Math.max(240, startW + (startX - ev.clientX)));
      side.style.width = w + 'px';
    };
    const up = () => {
      dragging = false;
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      localStorage.setItem('xueyu-ai-width', side.style.width);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
  const savedW = parseInt(localStorage.getItem('xueyu-ai-width'));
  if (savedW >= 240 && savedW <= 520) side.style.width = savedW + 'px';
})();

  else if (notes.length) await openNote(notes[0].id);
})();
</script>
