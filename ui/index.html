<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学屿 · 今日</title>
<link rel="stylesheet" href="/mac.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<style>
  .greet{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .greet h1{font-size:23px;font-weight:850}
  .greet p{color:var(--dim);font-size:12.5px}
  .home-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
  .w-stack{display:flex;flex-direction:column;gap:16px}
  .w-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .w-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .w-title b{font-size:14px}
  .w-title a{font-size:11.5px;font-weight:800;color:var(--blu);cursor:pointer}
  .mini-stat{font-size:26px;font-weight:850;margin:2px 0}
  .mini-sub{font-size:11.5px;color:var(--dim)}
  .stickies2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tk{cursor:default}
  .tk .right{gap:8px}
  @media(max-width:900px){.home-grid,.w-row{grid-template-columns:1fr}}
</style>
</head>
<body data-page="index">
<div class="app-shell">
  <header class="app-header" id="app-header" data-title="🏝️ 今日">
      <span class="app-title"><span class="ico">🏝️</span> 学屿</span>
      <span class="sep-v"></span>
      <span class="page-title">🏝️ 今日</span>
      <div class="tb-tools">
        <button class="tb-btn" id="global-search" title="全局搜索 ⌘K">🔍</button>
      </div>
    </header>
  <div class="app">
    <aside class="sidebar" id="app-sidebar">
        <div class="side-head" style="display:flex;align-items:center;padding:2px 6px 8px;border-bottom:2px dashed #e0d6bd;margin-bottom:6px">
          <b style="font-size:12px;color:var(--dim);letter-spacing:1px">学屿</b>
          <button class="tb-btn" id="side-collapse" title="收起侧边栏" style="margin-left:auto;width:26px;height:26px;min-width:26px">◧</button>
        </div>
        <div class="side-label">今天</div>
        <a class="side-it" href="/" data-nav="index" title="今日清单"><span class="ico2">☀️</span><span class="txt">今日清单</span><span class="cnt" id="cnt-today"></span></a>
        <a class="side-it" href="/plan" data-nav="plan" title="学习计划"><span class="ico2">📅</span><span class="txt">学习计划</span><span class="cnt" id="cnt-plans"></span></a>
        <div class="side-label">学习资产</div>
        <a class="side-it" href="/notes" data-nav="notes" title="笔记"><span class="ico2">📝</span><span class="txt">笔记</span><span class="cnt" id="cnt-notes"></span></a>
        <a class="side-it" href="/shelf" data-nav="shelf" title="书架"><span class="ico2">📚</span><span class="txt">书架</span><span class="cnt" id="cnt-shelf"></span></a>
        <a class="side-it" href="/research" data-nav="research" title="深度研究"><span class="ico2">🔬</span><span class="txt">深度研究</span><span class="cnt" id="cnt-research"></span></a>
        <a class="side-it" href="/settings" data-nav="settings" style="margin-top:auto">⚙️ 设置</a>
      </aside>
    <main class="main" id="main">
      <div class="greet">
        <h1 id="greet-line">正在加载…</h1>
        <p id="greet-sub"></p>
      </div>

      <div class="home-grid">
        <div class="card">
          <div class="w-title"><b>📅 今日清单 · 艾宾浩斯排期</b><span id="today-progress" style="font-size:11.5px;color:var(--dim);font-weight:800"></span></div>
          <div class="pbar" style="margin-bottom:12px"><i id="today-bar" style="width:0%"></i></div>
          <div id="today-list"><div class="empty"><span class="big">🌱</span>今日没有复习任务</div></div>

        </div>

        <div class="w-stack">
          <div class="w-row">
            <div class="card" style="padding:14px 18px">
              <div class="w-title"><b>🧠 记忆保持率</b></div>
              <div class="mini-stat" id="stat-retention" style="color:var(--grn)">--</div>
              <div class="mini-sub">基于艾宾浩斯遗忘曲线估算</div>
            </div>
            <div class="card" style="padding:14px 18px">
              <div class="w-title"><b>⏱ 本周专注</b></div>
              <div class="mini-stat" id="stat-focus" style="color:var(--blu)">--</div>
              <div class="mini-sub" id="stat-focus-sub">复习计时累计</div>
            </div>
          </div>

          <div class="card" id="research-card">
            <div class="w-title"><b>🔬 研究进行中</b><a onclick="location.href='/research'">查看 →</a></div>
            <div id="research-body"><div class="empty" style="padding:16px">当前没有进行中的研究</div></div>
          </div>

          <div>
            <div class="w-title" style="margin-bottom:10px"><b>📝 最近笔记</b><a onclick="location.href='/notes'">全部 →</a></div>
            <div class="stickies2" id="recent-notes"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/katex/auto-render.min.js"></script>
<script src="/app.js"></script>
<script>
// 标识符（$ / api / toast / esc 等）由 app.js 全局提供
const stickyColors = ['s-y','s-b','s-p','s-g','s-o','s-v'];

async function loadHome() {
  const ov = XueYu.SHELL.overview;
  if (!ov) return;
  // 问候
  const h = new Date().getHours();
  const hi = h < 6 ? '夜深了' : h < 11 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
  const nick = '同学';
  const focusH = (ov.stats.focus_today_sec / 3600).toFixed(1);
  $('#greet-line').innerHTML = `${hi}，<span class="hl">${esc(nick)}</span> ${h < 11 ? '☀️' : h < 18 ? '🌤' : '🌙'}`;
  const parts = [];
  if (ov.today.total) parts.push(`今日 ${ov.today.total} 项复习已做 ${ov.today.done} 项`);
  if (ov.stats.focus_today_sec > 60) parts.push(`已专注 ${focusH} 小时`);
  if (ov.stats.streak) parts.push(`连续打卡 ${ov.stats.streak} 天`);
  $('#greet-sub').textContent = parts.join(' · ') || (ov.ai_configured ? '从一项复习或一篇笔记开始吧' : '先到「设置」里配置 AI 模型，解锁全部能力');

  // 今日清单
  const t = await api('/plan/today');
  $('#today-progress').textContent = t.total ? `已完成 ${t.done} / ${t.total}` : '';
  $('#today-bar').style.width = t.total ? (t.done / t.total * 100) + '%' : '0%';
  const list = $('#today-list');
  if (!t.queue.length) {
    list.innerHTML = `<div class="empty"><span class="big">🌱</span>今日没有复习任务<br><button class="btn sm grn" style="margin-top:10px" onclick="location.href='/plan'">去学习计划 →</button></div>`;
  } else {
    list.innerHTML = t.queue.map(it => `
      <div class="tk ${it.done_today || it.run_state === 'done' ? 'done' : ''}" data-id="${it.id}">
        <div class="box">${it.done_today ? '✓' : ''}</div>
        <span class="tt">${esc(it.title)}</span>
        <span class="right">
          <span class="dtag ${it.stage === 0 ? 'g' : it.stage % 2 ? 'o' : 'b'}">${esc(it.stage_label)}</span>
          <span style="font-size:11px;color:var(--dim)">${it.done_today ? fmtSec(it.total_time_sec) : it.run_state === 'running' ? '<span class="live"></span>' : fmtSec(it.elapsed_sec)}</span>
        </span>
      </div>`).join('');
  }

  // 统计卡
  $('#stat-retention').textContent = ov.stats.retention != null ? ov.stats.retention + '%' : '--';
  $('#stat-focus').textContent = fmtHM(ov.stats.week_focus_sec);
  const d = ov.stats.week_focus_delta;
  $('#stat-focus-sub').textContent = d == null ? '坚持记录复习时长吧' : `比上周 ${d >= 0 ? '↑' : '↓'} ${Math.abs(Math.round(d * 100))}%`;

  // 研究进行中
  renderResearch(ov.research_running);
  // 最近笔记
  $('#recent-notes').innerHTML = (ov.recent_notes || []).slice(0, 4).map((n, i) => `
    <a class="sticky ${stickyColors[i % 6]}" href="/notes?id=${n.id}">
      <b>${esc(n.title)}</b><p>${esc(n.excerpt || '…')}</p>${n.ai_assisted ? '<span class="ai">✨ AI</span>' : ''}
    </a>`).join('') || '<div class="empty" style="padding:14px">还没有笔记，去写第一篇 →</div>';
}

function renderResearch(running) {
  const body = $('#research-body');
  if (!running || !running.length) {
    body.innerHTML = `<div class="empty" style="padding:16px">当前没有进行中的研究<br><a class="btn sm blu" style="margin-top:8px;display:inline-block" href="/research">发起研究 →</a></div>`;
    return;
  }
  body.innerHTML = running.map(t => `
    <div style="font-size:12.5px;font-weight:700;margin-bottom:6px;cursor:pointer" onclick="location.href='/research'"><span class="live"></span>${esc(t.query.slice(0, 24))}</div>
    <div class="pbar"><i style="width:${Math.round(t.progress * 100)}%"></i></div>
    <div class="mini-sub" style="margin-top:8px">${esc(t.current_step || '进行中')} · ${Math.round(t.progress * 100)}% · 完成后系统通知 🔔</div>`).join('');
}

XueYu.SHELL.ready.then(() => loadHome().catch(showError)).catch(() => {});
setInterval(loadHome, 15000);
</script>
</body>
</html>
